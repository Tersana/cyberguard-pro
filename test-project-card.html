<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Card Test</title>
  <link rel="stylesheet" href="cyber-theme.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="cyber-body p-8">
  <div class="max-w-7xl mx-auto">
    <h1 class="text-3xl font-bold text-white mb-8">Project Card Component Test</h1>
    
    <div id="test-container" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-4">
      <!-- Project cards will be rendered here -->
    </div>
  </div>

  <script src="main.js"></script>
  <script>
    // Test data
    const testProjects = [
      {
        id: 1,
        name: 'E-Commerce Security Audit',
        description: 'Comprehensive security assessment for online shopping platform including payment gateway testing',
        target: 'shop.example.com',
        status: 'active',
        collaborators: [
          { id: 1, full_name: 'John Doe', email: 'john@example.com' },
          { id: 2, full_name: 'Jane Smith', email: 'jane@example.com' }
        ]
      },
      {
        id: 2,
        name: 'Network Infrastructure Scan',
        description: 'Port scanning and vulnerability assessment of corporate network',
        target: '192.168.1.0/24',
        status: 'completed',
        collaborators: [
          { id: 3, full_name: 'Alice Johnson', email: 'alice@example.com' }
        ]
      },
      {
        id: 3,
        name: 'Legacy System Review',
        description: 'Security review of archived legacy application',
        target: 'legacy.oldsite.com',
        status: 'archived',
        collaborators: []
      },
      {
        id: 4,
        name: 'API Security Testing',
        description: 'REST API endpoint security testing and authentication bypass attempts',
        target: 'api.example.com',
        status: 'active',
        collaborators: [
          { id: 4, full_name: 'Bob Brown', email: 'bob@example.com' },
          { id: 5, full_name: 'Charlie Clark', email: 'charlie@example.com' },
          { id: 6, full_name: 'Diana Davis', email: 'diana@example.com' },
          { id: 7, full_name: 'Eve Evans', email: 'eve@example.com' },
          { id: 8, full_name: 'Frank Foster', email: 'frank@example.com' }
        ]
      }
    ];

    // Render test projects
    const container = document.getElementById('test-container');
    testProjects.forEach(project => {
      container.innerHTML += renderProjectCard(project);
    });

    // Mock functions for button clicks
    window.editProject = function(id) {
      alert(`Edit project ${id}`);
    };

    window.deleteProject = function(id) {
      if (confirm(`Delete project ${id}?`)) {
        alert(`Project ${id} deleted`);
      }
    };
  </script>
</body>
</html>
