<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Validation Test - CyberGuard Pro</title>
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 20px;
            background: #0F172A;
            color: #E2E8F0;
        }
        h1 {
            color: #A78BFA;
            border-bottom: 2px solid #A78BFA;
            padding-bottom: 10px;
        }
        .test-section {
            background: #1E293B;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            margin: 20px 0;
        }
        .test-case {
            margin: 15px 0;
            padding: 10px;
            background: #0F172A;
            border-radius: 4px;
        }
        .test-input {
            font-family: 'JetBrains Mono', monospace;
            color: #34D399;
        }
        .result {
            margin-top: 5px;
            padding: 5px 10px;
            border-radius: 4px;
            font-weight: 600;
        }
        .pass {
            background: #065F46;
            color: #34D399;
        }
        .fail {
            background: #7F1D1D;
            color: #F87171;
        }
        .info {
            background: #1E3A8A;
            color: #60A5FA;
            padding: 10px;
            border-radius: 4px;
            margin: 10px 0;
        }
        button {
            background: linear-gradient(135deg, #A78BFA 0%, #8B5CF6 100%);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            margin: 10px 5px;
        }
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
        }
    </style>
</head>
<body>
    <h1>📧 Email Validation Test Suite</h1>
    
    <div class="info">
        <strong>Test Objective:</strong> Verify that the email validation function correctly identifies valid and invalid email addresses according to RFC 5322 standards.
    </div>

    <div class="test-section">
        <h2>Valid Email Test Cases</h2>
        <div id="validTests"></div>
    </div>

    <div class="test-section">
        <h2>Invalid Email Test Cases</h2>
        <div id="invalidTests"></div>
    </div>

    <div class="test-section">
        <h2>Test Summary</h2>
        <div id="summary"></div>
    </div>

    <button onclick="runTests()">🔄 Run Tests Again</button>
    <button onclick="window.open('../../signup.html', '_blank')">🚀 Open Signup Page</button>

    <script>
        // Email validation function (same as in signup.html)
        function validateEmail(email) {
            // Basic format check: must have @ symbol
            if (!email || !email.includes('@')) {
                return false;
            }

            // Split into local and domain parts
            const parts = email.split('@');
            
            // Must have exactly one @ symbol
            if (parts.length !== 2) {
                return false;
            }

            const [localPart, domain] = parts;

            // Validate local part (before @)
            if (!localPart || localPart.length === 0 || localPart.length > 64) {
                return false;
            }

            // Local part cannot start or end with a dot
            if (localPart.startsWith('.') || localPart.endsWith('.')) {
                return false;
            }

            // Local part cannot have consecutive dots
            if (localPart.includes('..')) {
                return false;
            }

            // Local part can only contain valid characters
            const localPartRegex = /^[a-zA-Z0-9.!#$%&'*+\/=?^_`{|}~-]+$/;
            if (!localPartRegex.test(localPart)) {
                return false;
            }

            // Validate domain part (after @)
            if (!domain || domain.length === 0 || domain.length > 255) {
                return false;
            }

            // Domain must contain at least one dot
            if (!domain.includes('.')) {
                return false;
            }

            // Domain cannot start or end with a dot or hyphen
            if (domain.startsWith('.') || domain.endsWith('.') || 
                domain.startsWith('-') || domain.endsWith('-')) {
                return false;
            }

            // Domain cannot have consecutive dots
            if (domain.includes('..')) {
                return false;
            }

            // Split domain into labels (e.g., ["example", "com"])
            const domainLabels = domain.split('.');
            
            // Must have at least 2 labels (domain + TLD)
            if (domainLabels.length < 2) {
                return false;
            }

            // Validate each domain label
            for (const label of domainLabels) {
                // Each label must be 1-63 characters
                if (label.length === 0 || label.length > 63) {
                    return false;
                }

                // Label cannot start or end with hyphen
                if (label.startsWith('-') || label.endsWith('-')) {
                    return false;
                }

                // Label can only contain alphanumeric and hyphens
                if (!/^[a-zA-Z0-9-]+$/.test(label)) {
                    return false;
                }
            }

            // TLD (last label) must be at least 2 characters and only letters
            const tld = domainLabels[domainLabels.length - 1];
            if (tld.length < 2 || !/^[a-zA-Z]+$/.test(tld)) {
                return false;
            }

            return true;
        }

        // Test cases
        const validEmails = [
            'user@example.com',
            'john.doe@company.co.uk',
            'test+tag@domain.com',
            'admin@subdomain.example.org',
            'user123@test-domain.com',
            'first.last@example.com',
            'user_name@example.com',
            'test.email.with+symbol@example4u.net',
            'a@b.co',
            '123@example.com'
        ];

        const invalidEmails = [
            'tersaasdf',                    // Missing @ and domain
            'tersadas@ga',                  // Missing proper domain (no dot in domain)
            'user@',                        // Missing domain
            '@example.com',                 // Missing local part
            'user @example.com',            // Space in local part
            'user@example',                 // Missing TLD (no dot in domain)
            'user..name@example.com',       // Consecutive dots
            '.user@example.com',            // Leading dot
            'user.@example.com',            // Trailing dot
            'user@.example.com',            // Leading dot in domain
            'user@example..com',            // Consecutive dots in domain
            'user name@example.com',        // Space in email
            'user@exam ple.com',            // Space in domain
            '',                             // Empty string
            'plaintext',                    // No @ symbol
            'user@@example.com',            // Double @
            'user@example@com',             // Multiple @ symbols
            'user@domain.c',                // TLD too short (1 character)
            'user@-example.com',            // Domain starts with hyphen
            'user@example-.com',            // Domain label ends with hyphen
            'user@example.com-',            // Domain ends with hyphen
            'user@example.123',             // TLD with numbers
            'user@.com',                    // Missing domain name
            'user@domain.',                 // Trailing dot in domain
            '@',                            // Just @ symbol
            'user@domain..com'              // Consecutive dots in domain
        ];

        function runTests() {
            let passCount = 0;
            let failCount = 0;

            // Test valid emails
            const validTestsDiv = document.getElementById('validTests');
            validTestsDiv.innerHTML = '';
            
            validEmails.forEach(email => {
                const result = validateEmail(email);
                const testCase = document.createElement('div');
                testCase.className = 'test-case';
                
                const resultClass = result ? 'pass' : 'fail';
                if (result) passCount++;
                else failCount++;
                
                testCase.innerHTML = `
                    <div class="test-input">"${email}"</div>
                    <div class="result ${resultClass}">
                        ${result ? '✅ PASS' : '❌ FAIL'} - Expected: Valid, Got: ${result ? 'Valid' : 'Invalid'}
                    </div>
                `;
                validTestsDiv.appendChild(testCase);
            });

            // Test invalid emails
            const invalidTestsDiv = document.getElementById('invalidTests');
            invalidTestsDiv.innerHTML = '';
            
            invalidEmails.forEach(email => {
                const result = validateEmail(email);
                const testCase = document.createElement('div');
                testCase.className = 'test-case';
                
                const resultClass = !result ? 'pass' : 'fail';
                if (!result) passCount++;
                else failCount++;
                
                testCase.innerHTML = `
                    <div class="test-input">"${email || '(empty string)'}"</div>
                    <div class="result ${resultClass}">
                        ${!result ? '✅ PASS' : '❌ FAIL'} - Expected: Invalid, Got: ${result ? 'Valid' : 'Invalid'}
                    </div>
                `;
                invalidTestsDiv.appendChild(testCase);
            });

            // Summary
            const summaryDiv = document.getElementById('summary');
            const totalTests = validEmails.length + invalidEmails.length;
            const passRate = ((passCount / totalTests) * 100).toFixed(1);
            
            summaryDiv.innerHTML = `
                <div style="font-size: 1.2em; margin: 10px 0;">
                    <strong>Total Tests:</strong> ${totalTests}<br>
                    <strong style="color: #34D399;">Passed:</strong> ${passCount}<br>
                    <strong style="color: #F87171;">Failed:</strong> ${failCount}<br>
                    <strong>Pass Rate:</strong> ${passRate}%
                </div>
                ${passRate === '100.0' ? 
                    '<div class="pass" style="margin-top: 10px; padding: 15px; font-size: 1.1em;">🎉 All tests passed! Email validation is working correctly.</div>' : 
                    '<div class="fail" style="margin-top: 10px; padding: 15px; font-size: 1.1em;">⚠️ Some tests failed. Please review the validation logic.</div>'
                }
            `;
        }

        // Run tests on page load
        runTests();
    </script>
</body>
</html>
