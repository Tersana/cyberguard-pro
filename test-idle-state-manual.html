<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Idle State Manual Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .hidden { display: none; }
        .cyber-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
        }
    </style>
</head>
<body class="bg-gray-900 text-white p-8">
    <h1 class="text-2xl font-bold mb-6">Threat Intel Hub - Idle State Test</h1>
    
    <div class="mb-6">
        <p class="text-sm text-gray-400 mb-2">Expected behavior:</p>
        <ul class="text-sm text-gray-400 list-disc list-inside">
            <li>On page load, all three cards should show "Awaiting search" text</li>
            <li>Loading spinners should be hidden</li>
            <li>Status sections should be empty</li>
        </ul>
    </div>
    
    <div id="threat-intel-source-cards" class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <!-- VirusTotal Card -->
        <div id="virustotal-card" class="cyber-card p-6">
            <div class="flex flex-col space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-semibold text-purple-400">VirusTotal</h3>
                    <div id="virustotal-status" class="text-sm"></div>
                </div>
                
                <div id="virustotal-loading" class="hidden flex justify-center py-8">
                    <div class="w-8 h-8 border-4 border-purple-500/30 border-t-purple-500 rounded-full animate-spin"></div>
                </div>
                
                <div id="virustotal-results" class="text-center py-8 text-slate-400 text-sm">
                    Awaiting search
                </div>
            </div>
        </div>

        <!-- AbuseIPDB Card -->
        <div id="abuseipdb-card" class="cyber-card p-6">
            <div class="flex flex-col space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-semibold text-purple-400">AbuseIPDB</h3>
                    <div id="abuseipdb-status" class="text-sm"></div>
                </div>
                
                <div id="abuseipdb-loading" class="hidden flex justify-center py-8">
                    <div class="w-8 h-8 border-4 border-purple-500/30 border-t-purple-500 rounded-full animate-spin"></div>
                </div>
                
                <div id="abuseipdb-results" class="text-center py-8 text-slate-400 text-sm">
                    Awaiting search
                </div>
            </div>
        </div>

        <!-- URLScan Card -->
        <div id="urlscan-card" class="cyber-card p-6">
            <div class="flex flex-col space-y-4">
                <div class="flex items-center justify-between">
                    <h3 class="text-lg font-semibold text-purple-400">URLScan.io</h3>
                    <div id="urlscan-status" class="text-sm"></div>
                </div>
                
                <div id="urlscan-loading" class="hidden flex justify-center py-8">
                    <div class="w-8 h-8 border-4 border-purple-500/30 border-t-purple-500 rounded-full animate-spin"></div>
                </div>
                
                <div id="urlscan-results" class="text-center py-8 text-slate-400 text-sm">
                    Awaiting search
                </div>
            </div>
        </div>
    </div>
    
    <div class="mt-8">
        <button id="test-render-idle" class="bg-purple-600 hover:bg-purple-700 px-4 py-2 rounded">
            Test renderIdleState()
        </button>
        <button id="test-show-loading" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded ml-2">
            Test showLoadingState()
        </button>
        <button id="test-show-results" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded ml-2">
            Test renderSourceCard()
        </button>
    </div>
    
    <div class="mt-4 p-4 bg-gray-800 rounded">
        <h3 class="font-semibold mb-2">Test Results:</h3>
        <div id="test-output" class="text-sm text-gray-300 font-mono"></div>
    </div>

    <script type="module">
        // Import the module
        import { UIRenderer } from './threat-intel.js';
        
        const output = document.getElementById('test-output');
        
        function log(message) {
            output.innerHTML += message + '<br>';
        }
        
        // Test renderIdleState
        document.getElementById('test-render-idle').addEventListener('click', () => {
            output.innerHTML = '';
            log('Testing renderIdleState()...');
            
            UIRenderer.renderIdleState('virustotal');
            UIRenderer.renderIdleState('abuseipdb');
            UIRenderer.renderIdleState('urlscan');
            
            // Check results
            const vtLoading = document.getElementById('virustotal-loading');
            const vtResults = document.getElementById('virustotal-results');
            const vtStatus = document.getElementById('virustotal-status');
            
            log(`VirusTotal loading hidden: ${vtLoading.classList.contains('hidden')}`);
            log(`VirusTotal results visible: ${!vtResults.classList.contains('hidden')}`);
            log(`VirusTotal results text: "${vtResults.textContent.trim()}"`);
            log(`VirusTotal status empty: ${vtStatus.innerHTML === ''}`);
        });
        
        // Test showLoadingState
        document.getElementById('test-show-loading').addEventListener('click', () => {
            output.innerHTML = '';
            log('Testing showLoadingState()...');
            
            UIRenderer.showLoadingState('virustotal');
            
            const vtLoading = document.getElementById('virustotal-loading');
            const vtResults = document.getElementById('virustotal-results');
            
            log(`VirusTotal loading visible: ${!vtLoading.classList.contains('hidden')}`);
            log(`VirusTotal results hidden: ${vtResults.classList.contains('hidden')}`);
        });
        
        // Test renderSourceCard
        document.getElementById('test-show-results').addEventListener('click', () => {
            output.innerHTML = '';
            log('Testing renderSourceCard()...');
            
            UIRenderer.renderSourceCard('virustotal', {
                threatFlag: false,
                displayText: '0/50 engines flagged',
                rawData: { test: 'data' }
            });
            
            const vtLoading = document.getElementById('virustotal-loading');
            const vtResults = document.getElementById('virustotal-results');
            const vtStatus = document.getElementById('virustotal-status');
            
            log(`VirusTotal loading hidden: ${vtLoading.classList.contains('hidden')}`);
            log(`VirusTotal results visible: ${!vtResults.classList.contains('hidden')}`);
            log(`VirusTotal status has content: ${vtStatus.innerHTML !== ''}`);
        });
        
        log('Page loaded. Cards should show "Awaiting search" text.');
    </script>
</body>
</html>
