<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Projects Tab Switching</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #1a1a2e;
            color: #fff;
        }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            background: #16213e;
            border-radius: 8px;
        }
        .test-result {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
        }
        .pass {
            background: #0f3443;
            border-left: 4px solid #10b981;
        }
        .fail {
            background: #3d1a1a;
            border-left: 4px solid #ef4444;
        }
        button {
            padding: 10px 20px;
            margin: 5px;
            background: #7c3aed;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }
        button:hover {
            background: #6d28d9;
        }
    </style>
</head>
<body>
    <h1>Projects Tab Switching Test</h1>
    
    <div class="test-section">
        <h2>Test 1: Tab Manager Initialization</h2>
        <div id="test1-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 2: Projects Tab Registration</h2>
        <div id="test2-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 3: Switch to Projects Tab</h2>
        <button onclick="testSwitchToProjects()">Switch to Projects Tab</button>
        <div id="test3-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 4: Projects Tab Initialization</h2>
        <div id="test4-result"></div>
    </div>

    <div class="test-section">
        <h2>Test 5: ProjectManager Integration</h2>
        <div id="test5-result"></div>
    </div>

    <script>
        // Mock DOM elements needed for testing
        function setupMockDOM() {
            // Create tab pane
            const projectsPane = document.createElement('div');
            projectsPane.id = 'projects';
            projectsPane.className = 'tab-pane hidden';
            document.body.appendChild(projectsPane);

            // Create projects list container
            const projectsList = document.createElement('div');
            projectsList.id = 'projects-list';
            projectsPane.appendChild(projectsList);

            // Create empty state
            const emptyState = document.createElement('div');
            emptyState.id = 'projects-empty-state';
            emptyState.className = 'hidden';
            projectsPane.appendChild(emptyState);

            console.log('Mock DOM setup complete');
        }

        function showResult(testId, passed, message) {
            const resultDiv = document.getElementById(`${testId}-result`);
            resultDiv.className = `test-result ${passed ? 'pass' : 'fail'}`;
            resultDiv.innerHTML = `
                <strong>${passed ? '✓ PASS' : '✗ FAIL'}</strong>: ${message}
            `;
        }

        // Test 1: Check if DashboardTabManager exists
        function test1() {
            const passed = typeof DashboardTabManager !== 'undefined';
            showResult('test1', passed, 
                passed ? 'DashboardTabManager is defined' : 'DashboardTabManager is not defined'
            );
            return passed;
        }

        // Test 2: Check if Projects tab is registered
        function test2() {
            const passed = DashboardTabManager.tabInitialized.hasOwnProperty('projects');
            showResult('test2', passed,
                passed ? 'Projects tab is registered in tabInitialized' : 'Projects tab is NOT registered'
            );
            return passed;
        }

        // Test 3: Switch to Projects tab
        function testSwitchToProjects() {
            try {
                DashboardTabManager.switchTab('projects');
                const currentTab = DashboardTabManager.getCurrentTab();
                const passed = currentTab === 'projects';
                showResult('test3', passed,
                    passed ? `Successfully switched to projects tab (current: ${currentTab})` : `Failed to switch (current: ${currentTab})`
                );
                
                // Run test 4 after switching
                setTimeout(test4, 100);
            } catch (error) {
                showResult('test3', false, `Error: ${error.message}`);
            }
        }

        // Test 4: Check if Projects tab was initialized
        function test4() {
            const passed = DashboardTabManager.isTabInitialized('projects');
            showResult('test4', passed,
                passed ? 'Projects tab was initialized after switching' : 'Projects tab was NOT initialized'
            );
            return passed;
        }

        // Test 5: Check ProjectManager integration
        function test5() {
            const hasProjectManager = typeof window.projectManager !== 'undefined';
            const hasRenderMethod = hasProjectManager && typeof window.projectManager.renderProjectsList === 'function';
            const passed = hasProjectManager && hasRenderMethod;
            
            let message = '';
            if (!hasProjectManager) {
                message = 'window.projectManager is not defined';
            } else if (!hasRenderMethod) {
                message = 'projectManager.renderProjectsList method is not available';
            } else {
                message = 'ProjectManager is properly integrated with renderProjectsList method';
            }
            
            showResult('test5', passed, message);
            return passed;
        }

        // Run tests on load
        window.addEventListener('load', () => {
            console.log('Running tests...');
            setupMockDOM();
            
            setTimeout(() => {
                test1();
                test2();
                test5();
            }, 500);
        });
    </script>

    <!-- Load the actual dashboard-tab-manager.js -->
    <script src="dashboard-tab-manager.js"></script>
</body>
</html>
