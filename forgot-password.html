<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password - CyberGuard Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-950 text-white font-['Inter',sans-serif] flex items-center justify-center px-4">
  <main class="w-full max-w-md bg-slate-900/80 border border-slate-700 rounded-2xl p-6 shadow-2xl">
    <h1 class="text-2xl font-bold mb-2">Forgot your password?</h1>
    <p class="text-slate-400 mb-6">Enter your email and we will send a secure reset link.</p>

    <form id="forgotPasswordForm" class="space-y-4" novalidate>
      <div>
        <label for="email" class="block text-sm text-slate-300 mb-2">Email address</label>
        <input
          id="email"
          name="email"
          type="email"
          required
          class="w-full rounded-xl border border-slate-700 bg-slate-950 px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-cyan-500"
          placeholder="you@company.com"
        >
      </div>

      <button
        id="forgotPasswordSubmit"
        type="submit"
        class="w-full rounded-xl bg-cyan-600 hover:bg-cyan-500 transition-colors py-3 font-semibold"
      >
        Send Reset Link
      </button>

      <p id="forgotPasswordStatus" class="hidden text-sm rounded-lg px-3 py-2 border"></p>
    </form>

    <a href="login.html" class="inline-block mt-5 text-cyan-400 hover:text-cyan-300 text-sm">Back to login</a>
  </main>

  <script src="forgot-password.js"></script>
</body>
</html>
