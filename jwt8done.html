<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JWT Token Debugger & Editor</title>
  <style>
    :root {
      --bg-color: #070f19;
      --card-bg: #0e1726;
      --border-color: #1b2e4b;
      --text-color: #e0e6ed;
      --accent-color: #2f81f7;
      --highlight-orange: rgba(251, 140, 0, 0.25);
      --highlight-border: #fb8c00;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 30px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    h2 {
      margin: 0 0 20px 0;
      color: #fff;
      display: flex;
      align-items: center;
      font-size: 24px;
    }

    .grid-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 25px;
    }

    @media (max-width: 768px) {
      .grid-layout {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .card-full {
      grid-column: 1 / -1;
    }

    .label-container {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    label {
      font-size: 15px;
      font-weight: 600;
      color: #8898aa;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Single Interactive JWT Editor Box */
    .jwt-editable-box {
      width: 100%;
      min-height: 80px;
      background-color: #050a10;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #fff;
      padding: 15px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 15px;
      box-sizing: border-box;
      word-break: break-all;
      white-space: pre-wrap;
      overflow-y: auto;
    }

    /* Custom strict placeholder for the top text area */
    .jwt-editable-box:empty:before {
      content: attr(placeholder);
      color: #4f5d73;
      font-style: normal;
    }

    .jwt-editable-box:focus {
      outline: none;
      border-color: var(--accent-color);
    }

    /* JWT Parts Token Colors */
    .jwt-header { color: #ff6b6b; transition: all 0.2s ease; padding: 2px 0; }
    .jwt-payload { color: #a78bfa; transition: all 0.2s ease; padding: 2px 0; }
    .jwt-signature { color: #4fc3f7; transition: all 0.2s ease; padding: 2px 0; }
    .jwt-dot { color: #fff; }

    /* Dynamic Orange Highlight Styles */
    .active-highlight {
      background-color: var(--highlight-orange) !important;
      box-shadow: 0 0 0 2px var(--highlight-border);
      border-radius: 4px;
      color: #fff !important;
    }

    textarea, input[type="text"] {
      width: 100%;
      background-color: #050a10;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      color: #e0e6ed;
      padding: 15px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 14px;
      box-sizing: border-box;
      resize: vertical;
      line-height: 1.5;
    }

    #headerInput { color: #ffa657; height: 180px; }
    #payloadInput { color: #7ee787; height: 250px; }
    #secretInput { color: #4fc3f7; }

    .toggle-container {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: #8898aa;
    }

    /* Simple Switch Styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 34px;
      height: 20px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3f51b5; transition: .4s; border-radius: 34px;
    }
    .slider:before {
      position: absolute; content: ""; height: 14px; width: 14px; left: 3px; bottom: 3px;
      background-color: white; transition: .4s; border-radius: 50%;
    }
    input:checked + .slider { background-color: var(--accent-color); }
    input:checked + .slider:before { transform: translateX(14px); }
  </style>
</head>
<body>

  <div class="container">
    <h2>🔐 JWT Debugger & Editor</h2>

    <div class="grid-layout">
      <div class="card card-full">
        <div class="label-container">
          <label>📋 JWT String</label>
        </div>
        <div id="jwtTokenBox" class="jwt-editable-box" contenteditable="true" spellcheck="false" placeholder="paste your JWT here"></div>
      </div>

      <div class="card">
        <div class="label-container">
          <label>📦 Header</label>
        </div>
        <textarea id="headerInput"></textarea>
      </div>

      <div class="card">
        <div class="label-container">
          <label>📄 Payload</label>
        </div>
        <textarea id="payloadInput"></textarea>
      </div>

      <div class="card card-full">
        <div class="label-container">
          <label>🔑 Signing Key</label>
          <div class="toggle-container">
            <span>Base64 encoded</span>
            <label class="switch">
              <input type="checkbox" checked>
              <span class="slider"></span>
            </label>
          </div>
        </div>
        <input type="text" id="secretInput" placeholder="Enter secret key..." value="secret">
      </div>
    </div>
  </div>

  <script>
    // Safe Base64URL Decoding/Encoding
    function base64UrlDecode(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      return decodeURIComponent(atob(str).split('').map(c =>
        '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2)
      ).join(''));
    }

    function base64UrlEncode(str) {
      return btoa(unescape(encodeURIComponent(str)))
        .replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    const jwtTokenBox  = document.getElementById('jwtTokenBox');
    const headerInput  = document.getElementById('headerInput');
    const payloadInput = document.getElementById('payloadInput');
    const secretInput  = document.getElementById('secretInput');

    let activeHighlightTarget = null;

    // Parse the live token string from the top container into JSON textareas
    function parseTopToken() {
      const token = jwtTokenBox.innerText.trim();
      if (!token) {
        headerInput.value = '';
        payloadInput.value = '';
        return;
      }

      try {
        const parts = token.split('.');
        if (parts.length !== 3) return;

        headerInput.value = JSON.stringify(JSON.parse(base64UrlDecode(parts[0])), null, 2);
        payloadInput.value = JSON.stringify(JSON.parse(base64UrlDecode(parts[1])), null, 2);
        
        renderTokenStructure(parts[0], parts[1], parts[2]);
      } catch (e) {
        // Silent catch for live rendering stability
      }
    }

    // Rebuild the dynamic single JWT output token structure
    async function updateTokenFromInputs() {
      try {
        if (!headerInput.value.trim() && !payloadInput.value.trim()) {
          jwtTokenBox.innerHTML = '';
          return;
        }

        const headerObj = headerInput.value.trim() ? JSON.parse(headerInput.value) : {};
        const payloadObj = payloadInput.value.trim() ? JSON.parse(payloadInput.value) : {};

        const encHeader = base64UrlEncode(JSON.stringify(headerObj));
        const encPayload = base64UrlEncode(JSON.stringify(payloadObj));
        let signature = '';

        const secret = secretInput.value;
        if (secret) {
          const enc = new TextEncoder();
          const key = await crypto.subtle.importKey(
            'raw', enc.encode(secret), { name: 'HMAC', hash: 'SHA-256' }, false, ['sign']
          );
          const data = enc.encode(`${encHeader}.${encPayload}`);
          const sigBuffer = await crypto.subtle.sign('HMAC', key, data);
          
          const hashArray = Array.from(new Uint8Array(sigBuffer));
          const hashString = hashArray.map(b => String.fromCharCode(b)).join('');
          signature = base64UrlEncode(hashString);
        } else {
          const text = jwtTokenBox.innerText.trim();
          const parts = text.split('.');
          signature = parts.length === 3 ? parts[2] : '';
        }

        renderTokenStructure(encHeader, encPayload, signature);
      } catch (e) {
        // Silent catch to handle invalid JSON syntax on the fly
      }
    }

    // Colors and appends highlights to the single top container
    function renderTokenStructure(h, p, s) {
      const hClass = activeHighlightTarget === 'header' ? 'jwt-header active-highlight' : 'jwt-header';
      const pClass = activeHighlightTarget === 'payload' ? 'jwt-payload active-highlight' : 'jwt-payload';
      
      jwtTokenBox.innerHTML = `<span class="${hClass}">${h}</span><span class="jwt-dot">.</span><span class="${pClass}">${p}</span><span class="jwt-dot">.</span><span class="jwt-signature">${s}</span>`;
    }

    // Sync active highlight configurations based on context focus
    function setupHighlightEvents(inputElement, targetName) {
      inputElement.addEventListener('focus', () => {
        activeHighlightTarget = targetName;
        const targetSpan = jwtTokenBox.querySelector(`.jwt-${targetName}`);
        if (targetSpan) targetSpan.classList.add('active-highlight');
      });

      inputElement.addEventListener('blur', () => {
        activeHighlightTarget = null;
        const targetSpan = jwtTokenBox.querySelector(`.jwt-${targetName}`);
        if (targetSpan) targetSpan.classList.remove('active-highlight');
      });
    }

    setupHighlightEvents(headerInput, 'header');
    setupHighlightEvents(payloadInput, 'payload');

    // Event Bindings
    jwtTokenBox.addEventListener('input', parseTopToken);
    headerInput.addEventListener('input', updateTokenFromInputs);
    payloadInput.addEventListener('input', updateTokenFromInputs);
    secretInput.addEventListener('input', updateTokenFromInputs);
  </script>
</body>
</html>
