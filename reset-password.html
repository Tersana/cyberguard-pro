<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Reset Password - CyberGuard Pro</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="theme-tokens.css" />
        <style>
            body {
                font-family:
                    "Inter",
                    -apple-system,
                    BlinkMacSystemFont,
                    sans-serif;
                background-color: var(--cg-bg-base);
            }
            .glow-orb {
                position: fixed;
                border-radius: 9999px;
                filter: blur(80px);
                opacity: 0.45;
                pointer-events: none;
            }
            .glow-a {
                width: 420px;
                height: 420px;
                background: rgba(167, 139, 250, 0.28);
                top: -160px;
                right: -120px;
            }
            .glow-b {
                width: 360px;
                height: 360px;
                background: rgba(139, 92, 246, 0.22);
                bottom: -120px;
                left: -120px;
            }
            .glass-card {
                background: var(--cg-bg-surface);
                backdrop-filter: blur(14px);
                border: 1px solid var(--cg-border-subtle);
                box-shadow:
                    0 0 40px rgba(167, 139, 250, 0.2),
                    0 8px 24px rgba(0, 0, 0, 0.5);
            }
            .cyber-input {
                background: var(--cg-bg-elevated);
                border: 1px solid var(--cg-border-subtle);
                color: var(--cg-text-1);
                transition: all 0.2s ease;
            }
            .cyber-input::placeholder {
                color: var(--cg-text-3);
            }
            .cyber-input:focus {
                border-color: var(--cg-accent);
                box-shadow: 0 0 0 3px var(--cg-focus-ring);
                outline: none;
            }
            .btn-neon {
                background: linear-gradient(
                    135deg,
                    var(--cg-accent) 0%,
                    var(--cg-accent-dark) 100%
                );
                box-shadow: 0 0 24px rgba(167, 139, 250, 0.45);
                transition:
                    transform 0.2s ease,
                    box-shadow 0.2s ease;
            }
            .btn-neon:hover {
                transform: translateY(-1px);
                box-shadow: 0 0 30px rgba(167, 139, 250, 0.6);
            }
        </style>
    </head>
    <body class="min-h-screen text-white px-4 flex items-center justify-center">
        <div class="glow-orb glow-a"></div>
        <div class="glow-orb glow-b"></div>

        <main class="w-full max-w-md glass-card rounded-3xl p-8 relative z-10">
            <div class="text-center mb-8">
                <div class="inline-flex items-center gap-3 mb-5">
                    <div
                        class="w-10 h-10 rounded-xl flex items-center justify-center"
                        style="
                            background: linear-gradient(
                                135deg,
                                var(--cg-accent),
                                var(--cg-accent-dark)
                            );
                            box-shadow: 0 0 20px rgba(167, 139, 250, 0.4);
                        "
                    >
                        <svg
                            class="w-6 h-6 text-white"
                            fill="none"
                            viewBox="0 0 24 24"
                            stroke="currentColor"
                            stroke-width="2"
                        >
                            <path
                                stroke-linecap="round"
                                stroke-linejoin="round"
                                d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.286Z"
                            />
                        </svg>
                    </div>
                    <div class="text-left">
                        <p class="font-bold text-lg leading-tight">
                            CyberGuard Pro
                        </p>
                        <p class="text-xs text-slate-400">
                            Enterprise Security Platform
                        </p>
                    </div>
                </div>
                <h1 class="text-2xl font-bold mb-2">Reset your password</h1>
                <p class="text-slate-400 text-sm">
                    Create a new secure password to continue.
                </p>
            </div>

            <form id="resetPasswordForm" class="space-y-4" novalidate>
                <div>
                    <label for="email" class="block text-sm text-slate-300 mb-2"
                        >Email address</label
                    >
                    <div class="relative">
                        <span
                            class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"
                        >
                            <svg
                                class="w-5 h-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M21.75 6.75v10.5A2.25 2.25 0 0119.5 19.5h-15A2.25 2.25 0 012.25 17.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15A2.25 2.25 0 002.25 6.75m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75"
                                />
                            </svg>
                        </span>
                        <input
                            id="email"
                            name="email"
                            type="email"
                            readonly
                            class="cyber-input w-full rounded-xl pl-12 pr-4 py-3.5 text-slate-300 bg-slate-900/70"
                        />
                    </div>
                </div>

                <input id="token" name="token" type="hidden" />

                <div>
                    <label
                        for="new_password"
                        class="block text-sm text-slate-300 mb-2"
                        >New password</label
                    >
                    <div class="relative">
                        <span
                            class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"
                        >
                            <svg
                                class="w-5 h-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25Z"
                                />
                            </svg>
                        </span>
                        <input
                            id="new_password"
                            name="new_password"
                            type="password"
                            required
                            minlength="8"
                            class="cyber-input w-full rounded-xl pl-12 pr-12 py-3.5 text-white"
                        />
                        <button
                            id="toggleNewPassword"
                            type="button"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-cyan-300"
                        >
                            <svg
                                class="w-5 h-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                                />
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                                />
                            </svg>
                        </button>
                    </div>
                </div>

                <div>
                    <label
                        for="password_confirmation"
                        class="block text-sm text-slate-300 mb-2"
                        >Confirm password</label
                    >
                    <div class="relative">
                        <span
                            class="absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"
                        >
                            <svg
                                class="w-5 h-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25Z"
                                />
                            </svg>
                        </span>
                        <input
                            id="password_confirmation"
                            name="password_confirmation"
                            type="password"
                            required
                            minlength="8"
                            class="cyber-input w-full rounded-xl pl-12 pr-12 py-3.5 text-white"
                        />
                        <button
                            id="toggleConfirmPassword"
                            type="button"
                            class="absolute right-4 top-1/2 -translate-y-1/2 text-slate-500 hover:text-cyan-300"
                        >
                            <svg
                                class="w-5 h-5"
                                fill="none"
                                viewBox="0 0 24 24"
                                stroke="currentColor"
                                stroke-width="2"
                            >
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z"
                                />
                                <path
                                    stroke-linecap="round"
                                    stroke-linejoin="round"
                                    d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"
                                />
                            </svg>
                        </button>
                    </div>
                </div>

                <button
                    id="resetPasswordSubmit"
                    type="submit"
                    class="btn-neon w-full rounded-xl py-3.5 font-semibold text-white"
                >
                    Update Password
                </button>

                <p
                    id="resetPasswordStatus"
                    class="hidden text-sm rounded-lg px-3 py-2 border"
                ></p>
            </form>

            <a
                href="/login"
                class="inline-block mt-5 text-neon-purple hover:text-purple-300 text-sm"
                >Back to login</a
            >
        </main>

        <script src="cyber-notify.js"></script>
        <script src="reset-password.js"></script>
    </body>
</html>
